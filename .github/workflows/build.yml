name: Build MC Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          unzip -o mtr-ctrl-source.zip
          echo "=== 解压后的目录结构 ==="
          find . -type d -maxdepth 3
          echo ""
          echo "=== 查找 build.gradle ==="
          find . -name "build.gradle"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Find project directory and build
        run: |
          PROJECT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -1)
          echo "项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-jar
          path: "**/build/libs/*.jar"
