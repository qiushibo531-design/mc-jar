name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack source zip
        run: |
          ZIP="$(find . -maxdepth 2 -name '*.zip' | head -1)"
          if [ -z "$ZIP" ]; then
            echo "没找到 zip 源码包" >&2
            find . -maxdepth 2 >&2
            exit 1
          fi
          echo "解压：$ZIP"
          python3 -m zipfile -e "$ZIP" .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build
        run: |
          PROJECT_DIR="$(find . -name settings.gradle -not -path '*/.git/*' | head -1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "没找到 settings.gradle" >&2
            find . -maxdepth 3 >&2
            exit 1
          fi
          echo "Gradle 工程目录：$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtr-ctrl
          path: "**/build/libs/*.jar"
