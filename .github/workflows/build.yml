name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip source code
      run: unzip songrequest-mod.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Apply Loom Version Fix
      run: |
        cd songrequest-mod
        echo "loom.ignoreDependencyLoomVersionValidation=true" >> gradle.properties

    - name: Build with Gradle
      run: |
        cd songrequest-mod
        chmod +x gradlew
        ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: songrequest-mod/build/libs/*.jar
