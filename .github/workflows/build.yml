name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and find project folder
      run: |
        unzip songrequest-mod.zip -d extracted_mod
        PROJECT_DIR=$(find extracted_mod -maxdepth 1 -mindepth 1 -type d | head -n 1)
        if [ -z "$PROJECT_DIR" ]; then
          echo "No subdirectory found."
          mv extracted_mod/* . 2>/dev/null || true
        else
          echo "Found project folder: $PROJECT_DIR"
          mv "$PROJECT_DIR"/* . 2>/dev/null || true
        fi
        rm -rf extracted_mod

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar
