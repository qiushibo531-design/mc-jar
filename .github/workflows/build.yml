name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip source code
      run: unzip songrequest-mod.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Patch Code and Upgrade Environment
      run: |
        cd songrequest-mod
        
        # 👇 1. 自动搜索并修补 Menu.THEME
        # 找到 Menu.java 文件，如果是枚举，就在里面加上 THEME
        find . -name "Menu.java" -exec sed -i 's/\(public enum Menu {[^}]*\)/\1, THEME /g' {} \;
        
        # 如果它是用字符串或者常量定义的，强行塞一个常量
        find . -name "Menu.java" -exec sed -i '/public enum Menu/a\    public static final int THEME = 99;' {} \;
        
        echo "已尝试强行注入 THEME 变量！"

        # 👇 2. 强行升级 Loom 和 Gradle 版本（解决之前的报错）
        sed -i 's/1\.5\.[0-9]/1.6.5/g' build.gradle
        sed -i 's/1\.5-SNAPSHOT/1.6.5/g' build.gradle
        sed -i 's/1\.5\.[0-9]/1.6.5/g' gradle.properties
        sed -i 's/1\.5-SNAPSHOT/1.6.5/g' gradle.properties
        sed -i 's/1\.5\.[0-9]/1.6.5/g' settings.gradle
        sed -i 's/1\.5-SNAPSHOT/1.6.5/g' settings.gradle
        sed -i 's/gradle-[0-9]\.[0-9]/gradle-8.8/g' gradle/wrapper/gradle-wrapper.properties

    - name: Build with Gradle
      run: |
        cd songrequest-mod
        chmod +x gradlew
        ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: songrequest-mod/build/libs/*.jar
