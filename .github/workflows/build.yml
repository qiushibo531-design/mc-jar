name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download MTR dev jar
        run: |
          mkdir -p libs
          curl -fL --retry 3 -o "libs/MTR-fabric-4.0.5+1.20.4-server.jar" "https://www.minecrafttransitrailway.com/libs/4.0.5/MTR-fabric-4.0.5+1.20.4-server.jar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14

      - name: Build
        run: gradle build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtr-ctrl
          path: build/libs/*.jar
