name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip source
        run: unzip -q DangoMusic-1.20.4-source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Gradle
        working-directory: DangoMusic-main/modern
        run: |
          chmod +x gradlew
          ./gradlew :1.20.4-fabric:build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-1.20.4-fabric
          path: DangoMusic-main/modern/versions/1.20.4-fabric/build/libs/*.jar
