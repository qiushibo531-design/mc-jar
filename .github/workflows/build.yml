name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip source code
      run: unzip songrequest-mod.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Upgrade Loom Version
      run: |
        cd songrequest-mod
        # 强行把所有相关文件里的 1.5.x 替换成 1.6.5
        sed -i 's/1\.5\.[0-9]/1.6.5/g' build.gradle
        sed -i 's/1\.5-SNAPSHOT/1.6.5/g' build.gradle
        sed -i 's/1\.5\.[0-9]/1.6.5/g' gradle.properties
        sed -i 's/1\.5-SNAPSHOT/1.6.5/g' gradle.properties
        sed -i 's/1\.5\.[0-9]/1.6.5/g' settings.gradle
        sed -i 's/1\.5-SNAPSHOT/1.6.5/g' settings.gradle
        echo "版本号强制篡改完毕！"

    - name: Build with Gradle
      run: |
        cd songrequest-mod
        chmod +x gradlew
        ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: songrequest-mod/build/libs/*.jar
