name: Build MC Jar

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ⚠️ 修改1：把 source.zip 改成你实际的 zip 文件名
      - name: Unzip source
        run: |
          unzip -o source.zip
          echo "=== 解压后的目录结构 ==="
          find . -type d -maxdepth 3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⚠️ 修改2：把 modern 改成解压后包含 build.gradle 的实际目录名
      - name: Build with Gradle
        working-directory: ./modern
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      # ⚠️ 修改3：把 build/libs/*.jar 改成实际 jar 输出路径
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mc-jar
          path: ./modern/build/libs/*.jar
