name: Build Minecraft Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip and debug structure
      run: |
        unzip songrequest-mod.zip -d extracted_mod
        echo "=== 打印当前目录所有文件 ==="
        ls -la
        echo "=== 打印解压后的文件结构 ==="
        find extracted_mod -maxdepth 2
        
        # 强制把所有解压出来的文件移到根目录（无论嵌套了几层）
        mv extracted_mod/*/* ./ 2>/dev/null || true
        mv extracted_mod/* ./ 2>/dev/null || true
        rm -rf extracted_mod
        
        echo "=== 移动后的根目录文件 ==="
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        chmod +x gradlew
        ./gradlew build

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mod-jar
        path: build/libs/*.jar
